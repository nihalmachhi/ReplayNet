[project]
name = "replaynet"
version = "0.1.0"
description = "Sanitized incident evidence to repeatable network regression scenarios"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx2>=2,<3", "ruff>=0.6,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["replaynet"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]




